<!DOCTYPE html>
<html>
   <head>
      <title>grid2</title>
      <style>
            *{
                color:aliceblue;
            }
            .parent{
               height:100vh;
               color:white;
               text-align:center;
               display: grid;
               grid-template-rows: 15% 35% 65% 15% ;
               grid-template-columns: 25% 25% 25% 25%;
               gap: 10px;
         

            }
            .header{
               background-color: orangered;
                grid-column: 1/5;
                grid-row: 1/2;
      
            }
            .small1{
               background-color: orangered;
                grid-column: 1/2;
                grid-row: 2/3;

            }
            .small2{
               background-color: orangered;
                grid-column: 2/3;
                grid-row: 2/3;


            }
            .small3{
               background-color: orangered;
                grid-column: 3/4;
                grid-row: 2/3;

            }
            .sidebar{
               background-color: orangered;
                grid-column: 4/5;
                grid-row: 2/4;

            }
            .maincontent{
               background-color: orangered;
                grid-row: 3/4;
                grid-column: 1/4;

            }
            .footer{
               background-color: red;
                grid-row: 4/5;
                grid-column: 1/5;

            }

      </style>
   </head>
   <body>
      <div class="parent">
         <div class="header">Header</div>
            <div class="small1">small1</div>
            <div class="small2">small2</div>
            <div class="small3">small3</div>
            <div class="sidebar">sidebar</div>
            <div class="maincontent">main content</div>
            <div class="footer">footer</div>
        </div>
   </body>
</html>
