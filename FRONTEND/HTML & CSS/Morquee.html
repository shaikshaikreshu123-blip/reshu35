<!DOCTYPE html>
<html>
   <head>
      <title>Morquee-ex</title>
   </head>
   <body>
      <marquee width="30%">
         <img src="flower1.jpg" alt="flower1">
      </marquee>

       <marquee scrollamount="100">
         <img src="flower1.jpg" alt="flower1">
      </marquee>

        <marquee direction="right">
         <img src="flower1.jpg" alt="flower1">
      </marquee>

            <marquee direction="left">
         <img src="flower1.jpg" alt="flower1">
      </marquee>

            <marquee direction="up">
         <img src="flower1.jpg" alt="flower1">
      </marquee>
       
            <marquee direction="down">
         <img src="flower1.jpg" alt="flower1">
      </marquee>




   </body>
</html>
