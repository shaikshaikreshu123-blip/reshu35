<!DOCTYPE html>
<html>
    <head>
        <title>Media queries</title>
        <style>
            @media(max-width:1400px){
                body{
                    background-color: blue;
                }
            }
            @media(max-width:1200px){
                body{
                    background-color: brown;
                }
            }
            @media(max-width:990){
                body{
                    background-color: chocolate;
                }
            }
            @media(max-width:770){
                body{

                    background-color: hotpink;
                }
            }
            @media(max-width:550){
                body{
                    background-color: green;
                }
                
            }
        </styles>
    </head>
    <body>

    </body>
</html>
