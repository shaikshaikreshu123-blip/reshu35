<!DOCTYPE html>
<html>
    <head>
        <title>Grid Example</title>
        <style>
            *{
                padding: 40px;
                box-sizing: border-box;
                text-align: center;
                border-radius: 10px;
               
      
                
            }
            .parent{
               height: 100vh;
               color: white;
               text-align: center;
               display: grid;
               grid-template-rows: 15% 15% 70%;
               grid-template-columns: 35% 30% 40%;
               gap: 10px;
         
               
         
            .header{
                background-color: orange;
                grid-column: 1/4;
                grid-row: 1/1;
            }
            .Search{
                background-color: lightgreen;
                grid-column: 1/3;
                grid-row: 2/3;
            }
            .LeftSidebar{
                background-color: blue;
                grid-column: 1/2;
                grid-row: 3/4;
            }
            .MiddleColumn{
                background-color: blueviolet;
                grid-column: 2/3;
                grid-row: 3/4;
            }
            .Rightsidebar{
                background-color: orangered;
                grid-column: 3/4;
                grid-row: 2/4;
            }
        </style>
    </head>
    <body>
        <div class="parent">
            <div class="header">Header</div>
            <div class="Search">search</div>
            <div class="LeftSidebar">Left Sliderbar</div>
            <div class="MiddleColumn">MiddleColumn</div>
            <div class="Rightsidebar">Rightsidebar</div>
        </div>
    </body>
</html>
