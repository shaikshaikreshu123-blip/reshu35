<!DOCTYPE html>
<html>
    <head>
        <style>
            fieldset{
                border:none;
            }
        </style>
        <title>Fill below form to Register</title>
    </head>
    <body>
        <fieldset>
            <legend  style="font-size: 30px; font-weight: bold;">Fill below form to Register</legend>
            <form name="regform">
                <table>
                    <!--Enter your id-->
                    <tr>
                        <td>
                            <label>Enter your id:  </label>
                        </td>
                        <td>
                            <input type="text" name="fid">
                        </td>
                    </tr>
                    <!--Enter your name-->
                    <tr>
                        <td>
                            <label>Enter your name:  </label>
                        </td>
                        <td>
                            <input type="text" name="fname">
                        </td>
                    </tr>
                    <!--PASSWORD-->
                    <tr>
                        <td>
                            <label>Enter your Password:  </label>
                        </td>
                        <td> 
                            <input type="text" name="pwd">
                        </td>
                    </tr>
                    <!--Submit-->
                    <tr>
                        <td>
                            <input type="submit" value="Register">
                        </td>
                    </tr>
                </table>
            </form>
        </fieldset>
    </body>
</html>
