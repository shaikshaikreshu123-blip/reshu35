<!DOCTYPE html>
<html>
   <head>
      <title>relative</title>
      <style>
         .common{
            width:100px;
            height:100px;
            border: 1px solid crimson;
            font-weight:bold;
            color: beige;
         }
         .c1{
            background-color: blue;

         }
         .c2{
            background-color:chartreuse;
            position: relative;
            left:20px;
            bottom:80px;
            z-index: 10;
            

         }
         .c3{
            background-color: deeppink;
            position:relative;
            left:100px;
            bottom:30px;
            z-index:10;
            

 
         }
         .c4{
            background-color: darkorange;
            position: relative;
            left:60px;
            bottom:240px;
            z-index:10;
            


         }
         .c5{
             background-color: cadetblue;
            position: relative;
            left:80px;
            bottom:320px;
            z-index:10;
            

         }
      </style>
   </head> 
   <body>
      <div class="common c1">1</div>
      <div class="common c2">2</div>
      <div class="common c3">3</div>
      <div class="common c4">4</div>
      <div class="common c5">5</div>
      
      
   </body>
   
</html>
