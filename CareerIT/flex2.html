<!DOCTYPE html>
<html>
   <head>
      <title>flex-2</title>
      <style>
         .parent{
            display:flex;
            height:100vh;
            flex-direction: col-reverse;
            color:white;
         
         }
         .one{
            background-color: gold;
            flex:1;
         }
         .two{
            background-color: hotpink;
            flex:1
         }
      </style>

   </head>
   <body>
      <div class="parent">
         <div class="one">1</div>
         <div class="two">2</div>
      </div>
   </body>
</html>
