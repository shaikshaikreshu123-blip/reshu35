        <!--<script>
            /*
              Functions
              --------
                  particular business logic called as function
                                (or)
                  set of statements also called as "functions"
                  
                  Function are used to "reuse" the business logic

                  Types
                  -----
                  1) function declaration / named function
                  2) function expression / anonymous function
                  3) arrow function
                  4) constructor function
                  5) callback function
                  6) generator function
                  7) IIFE ( Immediate Invokable functional expression)
                  8) higher order of functions
                  9) pure functions

                  Function Declaration / named function
                  -------------------------------------
                      function with particular name (user defined name) called as function declaration / named functions

                      syntax.
                         function declaration
                         ********************
                         function functionname(param1,param2,param3,.....param n){
                         business logic
                         }
                         call the function
                         *****************
                         functionname(arg1,arg2,arg3,........arg n);


                    FUnction expression / anonymous function
                    ------------------------------------------
                        function without  particular name called as function declaration / named functions

                        syntax.
                         function expression
                         ********************
                         let functionname = function(param1,param2,param3,.....param n){
                         business logic
                         }
                         call the function
                         *****************
                         functionname(arg1,arg2,arg3,........arg n);

                    Arrow Function
                    -------------
                    we will represent arrow functions with ==>
                    arrow funtions relesed in ES6
                    arrow functions simplifies the business logic 
                      syntax.
                         function expression
                         ********************
                         let functionname = (param1,param2,param3,.....param n)==>{
                         business logic
                         }
                         call the function
                         *****************
                         functionname(arg1,arg2,arg3,........arg n);


                    Note: we are able to map function expression and arrow functions with help of variables

                    
            */
        </script>-->
