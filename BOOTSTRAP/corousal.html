<!DOCTYPE html>
<html>
    <head>
        <title>Carousel</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
            rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <div class="container mt-5">
            
        <div class="carousel carousel-dark carousel-fade" data-bs-ride="carousel" id="parent">
            <!--indicators-->
            <div class="carousel-indicators">
                <button data-bs-target="#parent" data-bs-slide-to="0" class="active"></button>
                <button data-bs-target="#parent" data-bs-slide-to="1"></button>
                <button data-bs-target="#parent" data-bs-slide-to="2"></button>
            </div>

            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="cat1.jpg" class="d-block w-50">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>CAT1</h5>
                        <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Non, voluptatem.</p>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="cat2.jpg" class="d-block w-50">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>CAT2</h5>
                        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Quaerat, minima?</p>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="cat3.jpg" class="d-block w-50">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>CAT3</h5>
                        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Quaerat, minima?</p>
                    </div>
                </div>
            </div>

            <div class="carousel-control-prev" data-bs-target="#parent" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
                <span class="visually-hidden">Previous</span>
            </div>
            <div class="carousel-control-next" data-bs-target="#parent" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
                <span class="visually-hidden">Next</span>
            </div>
        </div>
        </div>
    </body>
</html>
