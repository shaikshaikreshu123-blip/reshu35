<!DOCTYPE html>
<html>
   <head>
      <title>Buttons</title>
       <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
   </head>
   <body>
      <div class="container mt-5">
         <button class="btn btn-primary">Button</button>
         <button class="btn btn-success">Button</button>
          <button class="btn btn-info">Button</button>
         <button class="btn btn-dark">Button</button>
          <button class="btn btn-warning">Button</button>
          <button class="btn btn-secondary">Button</button>
         <button class="btn btn-danger">Button</button>
         <button class="btn btn-light">Button</button>

         <hr>
         <button class="btn btn-outline-primary">Button1</button>
        <button class=" btn btn-outline-success">Button1</button>
          <button class="btn btn-outline-info">Button1</button>
          <button class="btn btn-outline-dark">Button1</button>
          <button class="btn btn-outline-warning">Button</button>
          <button class="btn btn-outline-secondary">Button</button>
         <button class="btn btn-outline-danger">Button</button>
         <button class="btn btn-outline-light">Button</button>

         <hr>
         <button class="btn btn-primary btn-lg">Button1</button>
        <button class=" btn btn-success btn-*">Button1</button>
          <button class="btn btn-info btn-link">Button1</button>
          <button class="btn btn-dark btn-outline">Button1</button>
          <button class="btn btn-warning btn-lg">Button</button>
          <button class="btn btn-secondary btn-sm">Button</button>
         <button class="btn btn-danger btn-lg">Button</button>
         <button class="btn btn-light disabled">Button</button>
</div>
   </body>
</html>
